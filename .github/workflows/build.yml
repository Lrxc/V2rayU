name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers
          uname -m
          node --version || true
          pod --version || true

      - name: Install CocoaPods
        timeout-minutes: 15
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods --no-document
          fi
          pod install

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install appdmg
        run: npm install -g appdmg

      - name: Build archive and DMG
        run: |
          chmod +x Build/build.sh
          ./Build/build.sh

      - name: Verify artifacts
        run: |
          ls -lh Build/V2rayU-*.dmg
          shasum -a 256 Build/V2rayU-*.dmg
          lipo -info Build/release/V2rayU.app/Contents/MacOS/V2rayU
          test -x Build/release/V2rayU.app/Contents/Resources/v2ray-core/v2ray

      - name: Summary
        run: |
          {
            echo "### V2rayU build"
            echo
            echo "| file | size |"
            echo "| --- | --- |"
            ls -lh Build/V2rayU-*.dmg | awk '{print "| `" $9 "` | " $5 " |"}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload DMGs
        uses: actions/upload-artifact@v4
        with:
          name: V2rayU-dmg
          path: Build/V2rayU-*.dmg
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: V2rayU-dmg
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
